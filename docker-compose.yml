# Ambiente completo do FrequencIA em containers separados.
# mlflow: servidor de rastreamento com backend SQLite e artefatos em volume.
#   O servidor só aceita os Host listados em --allowed-hosts (proteção contra
#   DNS rebinding): sem "mlflow:5000", os outros serviços recebem 403 e o
#   rastreamento falha em silêncio.
# app: Streamlit de governança apontando para o MLflow do compose.
# cli: comandos pontuais na imagem de desenvolvimento, com a árvore de trabalho.
# smoke: perfil de ciclo único que roda e valida os smoke tests no venv do
# container e encerra com código de saída adequado.

services:
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: frequencia-runtime
    container_name: frequencia-mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:////dados/mlflow/mlflow.db
      --artifacts-destination /dados/mlflow/artifacts
      --host 0.0.0.0 --port 5000
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000
    ports:
      - "5000:5000"
    volumes:
      - dados:/dados
    environment:
      FREQUENCIA_WORKSPACE: /app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: frequencia-runtime
    container_name: frequencia-app
    command: streamlit run src/frequencia/web/app.py --server.address 0.0.0.0 --server.port 8501 --browser.gatherUsageStats false
    ports:
      - "8501:8501"
    volumes:
      - dados:/app/var
    environment:
      FREQUENCIA_WORKSPACE: /app
      FREQUENCIA_MLFLOW_URI: http://mlflow:5000
      FREQUENCIA_FUSO: America/Fortaleza
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  smoke:
    profiles: ["ciclo"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: frequencia-dev
    container_name: frequencia-smoke
    command: bash scripts/smoke.sh
    volumes:
      - dados:/app/var
    environment:
      FREQUENCIA_WORKSPACE: /app
      FREQUENCIA_MLFLOW_URI: http://mlflow:5000
      FREQUENCIA_PERFIL: fumaca
    depends_on:
      mlflow:
        condition: service_healthy
    restart: "no"

  cli:
    profiles: ["cli"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: frequencia-dev
    command: bash
    volumes:
      - .:/app
      - dados:/app/var
      - /app/.git
      - /app/.venv
      - /app/.hypothesis
      - /app/.pytest_cache
      - /app/.ruff_cache
      - /app/.mypy_cache
    environment:
      FREQUENCIA_WORKSPACE: /app
      FREQUENCIA_MLFLOW_URI: http://mlflow:5000
      FREQUENCIA_FUSO: America/Fortaleza
    depends_on:
      mlflow:
        condition: service_healthy
    restart: "no"

volumes:
  dados:
