name: Melhoria
description: Proponha uma funcionalidade ou melhoria.
title: "[Melhoria]: "
labels:
  - enhancement
  - triagem
body:
  - type: checkboxes
    id: busca
    attributes:
      label: Antes de abrir
      options:
        - label: Procurei issues abertas e fechadas e não encontrei uma equivalente.
          required: true
  - type: textarea
    id: problema
    attributes:
      label: Problema
      description: Qual necessidade ou dificuldade motiva a proposta?
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Proposta
      description: Descreva o comportamento desejado.
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
      description: Quais outras soluções foram avaliadas e por que foram descartadas?
    validations:
      required: false
  - type: textarea
    id: hipotese
    attributes:
      label: Hipótese e evidência
      description: Se a proposta for uma pesquisa, descreva a hipótese, a evidência atual e como ela seria validada.
      placeholder: |
        Hipótese:
        Evidência atual:
        Como validar:
        O que mudaria a opinião:
    validations:
      required: false
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceite
      description: Liste o que precisa estar pronto para considerar a proposta concluída.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área beneficiada
      options:
        - Dados
        - Features
        - Treino e pipelines
        - Modelos e registro
        - Exportação e integração
        - Monitoramento
        - Privacidade
        - CLI
        - Painel
        - Infraestrutura e governança
        - Todas
    validations:
      required: true
  - type: dropdown
    id: papel
    attributes:
      label: Papel beneficiado
      options:
        - Observador
        - Cientista
        - Engenheiro
        - Aprovador
        - Todos
        - Não se aplica
    validations:
      required: true
  - type: dropdown
    id: disposicao
    attributes:
      label: Disposição para contribuir
      options:
        - Posso implementar a mudança
        - Posso ajudar nos testes
        - Apenas reporto a proposta
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: Contexto adicional
      description: Referências, esboços ou restrições, sem dados sensíveis.
    validations:
      required: false
  - type: checkboxes
    id: privacidade
    attributes:
      label: Privacidade
      options:
        - label: Confirmei que não incluí segredos, credenciais nem dados reais de alunos, responsáveis ou professores.
          required: true
