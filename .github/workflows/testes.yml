# Ciclo completo com dados sintéticos e paridade Python e Node.
name: Testes

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: testes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ciclo:
    name: Ciclo completo e paridade
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Preparar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Preparar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Instalar bibliotecas de sistema
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip check

      - name: Executar o ciclo completo
        run: bash scripts/smoke.sh

      # O perfil de fumaça valida a mecânica; a aprovação dos gates é exigida
      # no perfil padrão, que tem volume para o veredito significar algo.
      - name: Exigir todos os gates no perfil padrão
        env:
          FREQUENCIA_TESTES_LENTOS: "1"
        run: python -m pytest tests/exportacao/test_qualidade.py -q

      - name: Publicar relatórios em caso de falha
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relatorios-smoke
          path: var/relatorios/
          if-no-files-found: ignore
          retention-days: 7

  compose:
    name: Compose e imagem
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validar a configuração do Compose
        run: docker compose config --quiet

      - name: Construir as imagens
        run: docker compose --profile ciclo build

      - name: Subir o MLflow e o painel
        run: docker compose up -d mlflow app

      - name: Aguardar a saúde dos serviços
        shell: bash
        run: |
          for tentativa in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health > /dev/null \
              && curl -fsS http://127.0.0.1:5000/health > /dev/null; then
              echo "Serviços disponíveis após ${tentativa} tentativa(s)."
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Rodar o ciclo completo no container
        run: docker compose --profile ciclo run --rm smoke

      - name: Exibir logs em caso de falha
        if: failure()
        run: docker compose --profile ciclo logs

      - name: Derrubar o ambiente
        if: always()
        run: docker compose --profile ciclo down -v --remove-orphans
